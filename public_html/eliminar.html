<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar Actividad</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body onload="cargarDatosEliminacion()">
    <div class="container">
        <header>
            <h1>🗑️ Eliminar Actividad</h1>
            <p>Confirmación de eliminación</p>
        </header>

        <nav class="navbar">
            <a href="index.html" class="nav-home">🏠 Inicio</a>
            <a href="registrar.html" class="nav-registrar">➕ Registrar</a>
            <a href="consultar.html" class="nav-consultar">📋 Consultar</a>
        </nav>

        <main>
            <h2>Confirmar Eliminación</h2>
            <div id="confirm-box" class="confirm-box">
                <div class="warning-icon">⚠️</div>
                <h3>¿Está seguro de eliminar esta actividad?</h3>
                <p><strong>ID:</strong> <span id="actividad-id">-</span></p>
                <p><strong>Título:</strong> <span id="actividad-titulo">-</span></p>
                <p style="color:#e74c3c;margin-top:10px;">Esta acción no se puede deshacer.</p>
                <div class="btn-group" style="justify-content:center;margin-top:20px;">
                    <button onclick="eliminarActividad()" class="btn btn-danger">🗑️ Sí, Eliminar</button>
                    <a href="consultar.html" class="btn btn-secondary">❌ Cancelar</a>
                </div>
            </div>
        </main>
        <footer><p>&copy; 2026 - Sistema de Gestión de Quehaceres Domésticos</p></footer>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
